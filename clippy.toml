# Law G1 (no-libm-direct): the platform transcendental functions round differently across targets, so
# a Law path calls them only through alice-det-math. The list is the `banned` methods of G1 in ALICE-Law
# conformance/gates.toml, for f32 and f64. `sqrt` and `mul_add` are correctly rounded and stay allowed;
# `powi` is pending there and banned here by default.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::cos", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::tan", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::sin_cos", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::asin", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::acos", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::atan", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::atan2", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::sinh", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::cosh", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::tanh", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::asinh", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::acosh", reason = "platform libm (Law G1); use alice_det_math" },
    { path = "f32::atanh", reason = "platform libm (Law G1); use alice_det_math" },
