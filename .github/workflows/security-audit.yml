name: Security & Hygiene

# - RustSec advisories (cargo audit), weekly as well as on dependency changes
# - licence / advisory / source policy (cargo deny, deny.toml)
# - unused dependencies (cargo machete)
#
# The ignored advisories are listed with their reason in deny.toml; the
# `cargo audit` ignore list below is kept identical.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/**'
      - 'build.rs'
      - 'deny.toml'
      - 'Cargo.lock'
      - '.github/workflows/security-audit.yml'
      - '.github/paths/security-audit.txt'
  schedule:
    # Mondays 09:00 UTC: new advisories appear without a commit here
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/security-audit.txt

  audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # the committed Cargo.lock (ALICE dependencies from git main, pinned by the lock)
      # bincode (unmaintained, no vulnerability) comes through alice-sdf 7 (bincode 2), the same
      # entry as deny.toml; it goes when alice-sdf moves off bincode
      - name: Run cargo audit
        run: |
          cargo audit \
            --deny yanked \
            --ignore RUSTSEC-2025-0020 \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0141

  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo deny (licences, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Run cargo machete
        run: cargo machete

  gate:
    name: Gate
    if: always()
    needs: [changes, audit, deny, unused-deps]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
