name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Every job that builds the crate first clones the sibling path dependencies
# with .github/actions/sibling-deps (ALICE-ML always, ALICE-Physics when the
# job builds `physics` / `physics-solver`) and removes alice-sdf from
# Cargo.toml (scripts/strip_sibling_deps.sh). The `sdf` and `cuda` features
# are therefore not built in CI (`cuda` needs nvcc). alice-db is resolved from
# crates.io, so the `db` feature is built, linted and tested.
#
# scripts/preflight.sh runs the same commands locally.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  # public documents: no development-process vocabulary, device names or
  # private names; CHANGELOG version headings and [Unreleased] categories well
  # formed. Run on every OS so a locale or path difference in the checker
  # itself shows up here rather than as a silent pass.
  docs-lint:
    name: Docs lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      - name: WGSL barrier lint (tests)
        run: python scripts/test_wgsl_barrier_lint.py
      - name: WGSL barrier lint (no return before a workgroup barrier)
        run: python scripts/wgsl_barrier_lint.py
      - name: No direct rkyv use (tests)
        run: python scripts/test_no_direct_rkyv.py
      - name: No direct rkyv use (the RUSTSEC-2026-0235 ignore depends on it)
        run: python scripts/no_direct_rkyv.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'true'
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      # pyo3 0.22 (feature `python`) supports CPython up to 3.13
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (every feature CI builds, all targets)
        run: cargo clippy --all-targets --features "ffi,python,view,voice,fix128-arithmetic,physics-solver,db" -- -D warnings

  # Tests whose modules never create a GPU device (constraint graph colouring,
  # WGSL source checks, the view / voice bridges) plus the doctests. They run on
  # every OS independently of the adapter the runner exposes.
  cpu-test:
    name: Test without a GPU (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'false'
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Test (device-free modules, zero executed is red)
        shell: bash
        # quoted: a bare `::` makes YAML read the line as a mapping
        run: 'bash scripts/cargo_test_nonzero.sh --lib --features "view,voice" -- constraint_graph:: kernel:: view_bridge:: voice_bridge::'
      - name: Doctests (zero executed is red)
        shell: bash
        run: bash scripts/cargo_test_nonzero.sh --doc --features "ffi,view,voice"

  # The `db` bridge (src/db_bridge.rs) over the blob store of alice-db, which
  # is resolved from crates.io. No GPU device is created. It runs on every OS
  # because alice-db writes files (blob WAL, lock file) through
  # platform-specific code.
  db-test:
    name: DB bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'false'
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (lib, db)
        run: cargo check --lib --features db
      - name: Test db bridge (zero executed is red)
        shell: bash
        # quoted: a bare `::` makes YAML read the line as a mapping
        run: 'bash scripts/cargo_test_nonzero.sh --lib --features db -- db_bridge::'

  # The declared `rust-version` is compiled with exactly that toolchain.
  # Cargo.lock is not committed and `resolver = "3"` makes the fresh resolution
  # prefer dependency versions that support it. Bump `rust-version` and the
  # toolchain below in the same commit.
  msrv:
    name: MSRV (rust-version = 1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'true'
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV (lib, default features)
        run: cargo +1.87 check --lib
      - name: cargo check on MSRV (lib, every feature CI builds except python)
        run: cargo +1.87 check --lib --features "ffi,view,voice,fix128-arithmetic,physics-solver,db"

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'true'
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (no-deps, default features)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: cargo doc (no-deps, every feature CI builds except python)
        run: cargo doc --lib --no-deps --features "ffi,view,voice,fix128-arithmetic,physics-solver,db"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  fix128-gpu-matrix:
    name: Fix128 GPU (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Install Vulkan / Mesa (Linux only, provides the lavapipe software adapter)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mesa-vulkan-drivers \
            vulkan-tools \
            libvulkan1 \
            libvulkan-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-fix128-${{ hashFiles('Cargo.toml') }}

      # this lane builds `fix128-arithmetic` alone, without alice-physics
      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'false'

      - name: Build (fix128-arithmetic)
        run: cargo build --lib --features fix128-arithmetic

      - name: Test — Fix128 CPU reference (no GPU)
        run: cargo test --lib --features fix128-arithmetic fix128::tests::fix128_gpu_

      - name: Test — WGSL shader source symbol coverage (no GPU)
        run: cargo test --lib --features fix128-arithmetic fix128::tests::wgsl_

      # TRT_REQUIRE_GPU (set by the wrapper): a missing adapter fails the run,
      # and the wrapper fails when no test acquired a device or any test skipped.
      - name: Test — Fix128 GPU dispatch (adapter required, zero devices is red)
        shell: bash
        run: bash scripts/cargo_test_gpu.sh --lib --features fix128-arithmetic fix128 -- --nocapture --test-threads=1

      # Closed-form oracles (tests/analytic_oracle.rs): GPU ternary matvec and
      # two-layer forward against integer closed forms, Fix128 GPU arithmetic
      # against dyadic closed forms, voice / view bridges against closed forms.
      # A missing adapter is a failure, not a skip.
      # On windows-latest this runs on the DX12 WARP adapter, which faulted on
      # the tiled matvec kernel while it returned before its workgroup barriers;
      # scripts/wgsl_barrier_lint.py keeps that shape out of every kernel.
      - name: Test — analytic oracles (GPU + fix128 + voice / view bridges)
        run: cargo test --test analytic_oracle --features fix128-arithmetic,voice,view -- --test-threads=1

  # Byte-exact CPU-GPU goldens of the physics-solver pipeline (Morton sort, BVH
  # build, find_pairs, sphere-sphere contact, PGS contact solve sequential and
  # batched, PhysicsWorld step_with_bridge) on Metal, Vulkan lavapipe and DX12
  # WARP.
  #
  # On windows-latest (DX12 WARP) the BVH build kernel's frame loop must stay
  # free of `continue` (the adapter dropped the stores of a `continue` region
  # and the loop never ended); `wgsl_bvh_build_frame_loop_has_no_continue`
  # guards that loop.
  fix128-physics-solver-matrix:
    name: Fix128 GPU + physics-solver goldens (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Install Vulkan / Mesa (Linux only, provides the lavapipe software adapter)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mesa-vulkan-drivers \
            vulkan-tools \
            libvulkan1 \
            libvulkan-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-physics-solver-${{ hashFiles('Cargo.toml') }}

      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'true'

      - name: Build (fix128-arithmetic + physics-solver)
        run: cargo build --lib --features fix128-arithmetic,physics-solver

      # The full lib suite with physics-solver enabled. Every runner in this
      # matrix has an adapter (Metal / lavapipe / WARP); TRT_REQUIRE_GPU (set by
      # the wrapper) makes a missing one fail the run instead of skipping the
      # goldens, and the wrapper fails when no test acquired a device or any
      # test skipped.
      - name: Test — physics-solver byte-exact CPU-GPU goldens (adapter required)
        shell: bash
        run: bash scripts/cargo_test_gpu.sh --lib --features fix128-arithmetic,physics-solver -- --nocapture --test-threads=1

      # The requirement has teeth: with the adapter hidden the same kind of run
      # must fail on the TRT_REQUIRE_GPU panic.
      - name: Self-test — a hidden adapter fails the run
        shell: bash
        run: bash scripts/cargo_test_gpu.sh --self-test --lib --features fix128-arithmetic,physics-solver fix128::tests::wgpu_add_matches_cpu_golden -- --test-threads=1
