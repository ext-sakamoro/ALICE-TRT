name: diag windows gpu

# Diagnostic-only run (not for main): isolates which GPU test kills the test
# process on windows-latest and prints the real exit status in hex.
on:
  push:
    branches: ['ci/20261013-trt-windows-gpu-diag']

jobs:
  diag:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: ./.github/actions/sibling-deps
        with:
          physics: 'true'
      - name: Build tests
        run: |
          cargo test --no-run --test analytic_oracle --features fix128-arithmetic,voice,view
          cargo test --no-run --lib --features fix128-arithmetic,physics-solver
      - name: Each analytic_oracle test in its own process
        continue-on-error: true
        run: |
          $names = cargo test --test analytic_oracle --features fix128-arithmetic,voice,view -- --list --format terse 2>$null |
            Where-Object { $_ -match ': test$' } | ForEach-Object { $_ -replace ': test$','' }
          "tests: $($names.Count)"
          foreach ($n in $names) {
            cargo test --test analytic_oracle --features fix128-arithmetic,voice,view -- --exact $n --nocapture --test-threads=1 *> "out-$($n -replace '[:]','_').log"
            "$n  exit=$LASTEXITCODE"
          }
      - name: Ternary shapes x ops, one process each
        continue-on-error: true
        run: |
          cargo test --no-run --test diag_ternary
          foreach ($op in 'matvec','batch') {
            foreach ($sz in '4x8','37x100','16x1024','3x2048','129x1100','32x32','1x1023','1x1024') {
              $o,$i = $sz.Split('x')
              $env:TRT_DIAG_OUT=$o; $env:TRT_DIAG_INP=$i; $env:TRT_DIAG_OP=$op
              $last = (cargo test --test diag_ternary -- --nocapture 2>&1 | Select-String '\[diag\]' | Select-Object -Last 1)
              "$op $sz exit=$LASTEXITCODE last=$last"
            }
          }
      - name: Tiled kernel variants, one process each
        continue-on-error: true
        run: |
          cargo test --no-run --test diag_tiled
          foreach ($v in 'v1','v2','v3','v5','minimal') {
            $env:TRT_DIAG_VARIANT=$v
            $last = (cargo test --test diag_tiled -- --nocapture 2>&1 | Select-String '\[diag\]' | Select-Object -Last 1)
            "$v exit=$LASTEXITCODE last=$last"
          }
      - name: The full analytic_oracle binary, as CI runs it
        continue-on-error: true
        run: |
          cargo test --test analytic_oracle --features fix128-arithmetic,voice,view -- --nocapture --test-threads=1
          "exit=$LASTEXITCODE"
      - name: The BVH build golden alone
        continue-on-error: true
        run: |
          cargo test --lib --features fix128-arithmetic,physics-solver -- --exact fix128::tests::wgpu_bvh_build_matches_cpu_golden --nocapture --test-threads=1
          "exit=$LASTEXITCODE"
      - name: Per-test logs (tail)
        if: always()
        run: Get-ChildItem out-*.log | ForEach-Object { "=== $($_.Name)"; Get-Content $_ -Tail 40 }
