# Dependabot: GitHub Actions only, major bumps excluded (they need a manual review)
#
# There is no root cargo entry: the ALICE dependencies come from git (branch main) and move
# with `cargo update -p <name>` in a reviewed commit, like the other cargo dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
