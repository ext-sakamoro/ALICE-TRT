# Dependabot: GitHub Actions only, major bumps excluded (they need a manual review)
#
# There is no root cargo entry: Cargo.toml declares sibling path dependencies
# (path = "../ALICE-Xxxx") that Dependabot does not check out, so a cargo update
# job fails with path_dependencies_not_reachable. Cargo dependencies are
# updated by hand with `cargo update -p <name>`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
