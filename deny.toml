# cargo-deny configuration (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# CI (security-audit.yml) runs `cargo deny --all-features check all` after the
# sibling path dependency alice-sdf has been removed from Cargo.toml (the same
# preparation as ci.yml), so the graph checked here is the graph CI builds.
# alice-db (feature `db`) is a crates.io dependency and is part of the graph.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # pyo3 0.22 (feature `python` only). Fixed in pyo3 0.24.1 / 0.29; the
    # upgrade changes the binding API used by src/python.rs and is pending.
    "RUSTSEC-2025-0020",  # PyString::from_object buffer overflow
    "RUSTSEC-2026-0177",  # PyCFunction::new_closure missing Sync bound
    # paste (unmaintained) reaches the graph through wgpu-hal 24 -> metal 0.31;
    # it is a proc-macro with no runtime code. Drops out with a wgpu upgrade.
    "RUSTSEC-2024-0436",
    # rkyv 0.7 Rc/Arc archive validation: rkyv is reached only through
    # alice-db (`db` feature), whose archived types (SegmentMetadata /
    # DataSegment / ModelType / DataType) hold no Rc / Arc, so the advisory
    # does not apply. This crate neither depends on rkyv nor archives
    # anything (scripts/no_direct_rkyv.py fails if either changes). Root fix:
    # alice-db moving off rkyv 0.7 (pending); drop the entry when that
    # release is consumed.
    "RUSTSEC-2026-0235",
    # bincode 1.3 (unmaintained, no vulnerability; feature `db`, through
    # alice-db 0.5, which reads its legacy segment format with it). alice-db
    # ignores it for the same reason; drop the entry when an alice-db release
    # without the legacy reader is consumed.
    "RUSTSEC-2025-0141",
]

# ---------------------------------------------------------------------------
# Licenses (allow-list)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

# This crate and its ALICE path dependencies take their own licence exceptions;
# the exceptions are for them only, not for third-party dependencies.
[[licenses.exceptions]]
name = "alice-trt"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-ml"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-physics"
allow = ["LicenseRef-Proprietary"]

# alice-physics 4.0 is a facade over alice-physics-core (same license)
[[licenses.exceptions]]
name = "alice-physics-core"
allow = ["LicenseRef-Proprietary"]

# alice-db (feature `db`, crates.io): the exception names that one crate only,
# and only the optional `db` feature pulls it in.
[[licenses.exceptions]]
name = "alice-db"
allow = ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]

# ---------------------------------------------------------------------------
# Bans (duplicates / wildcards)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dependencies have no version requirement
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
