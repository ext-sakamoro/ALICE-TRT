# cargo-deny configuration (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# CI (security-audit.yml) runs `cargo deny --all-features check all` after the
# sibling path dependency alice-sdf has been removed from Cargo.toml (the same
# preparation as ci.yml), so the graph checked here is the graph CI builds.
# alice-db (feature `db`) is a crates.io dependency and is part of the graph.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # pyo3 0.22 (feature `python` only). Fixed in pyo3 0.24.1 / 0.29; the
    # upgrade changes the binding API used by src/python.rs and is pending.
    "RUSTSEC-2025-0020",  # PyString::from_object buffer overflow
    "RUSTSEC-2026-0177",  # PyCFunction::new_closure missing Sync bound
    # paste (unmaintained) reaches the graph through wgpu-hal 24 -> metal 0.31;
    # it is a proc-macro with no runtime code. Drops out with a wgpu upgrade.
    "RUSTSEC-2024-0436",
    # bincode (unmaintained, no vulnerability; feature `sdf`, bincode 2 through alice-sdf 7).
    # Drop the entry when alice-sdf moves off bincode.
    "RUSTSEC-2025-0141",
]

# ---------------------------------------------------------------------------
# Licenses (allow-list)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

# This crate and its ALICE git dependencies take their own licence exceptions;
# the exceptions are for them only, not for third-party dependencies.
[[licenses.exceptions]]
name = "alice-trt"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-ml"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-physics"
allow = ["LicenseRef-Proprietary"]

# alice-physics 4.0 is a facade over alice-physics-core (same license)
[[licenses.exceptions]]
name = "alice-physics-core"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-db"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-det-math"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-sdf"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-serial"
allow = ["LicenseRef-Proprietary"]

[[licenses.exceptions]]
name = "alice-zip"
allow = ["LicenseRef-Proprietary"]

# alice-db (feature `db`, crates.io): the exception names that one crate only,
# and only the optional `db` feature pulls it in.
# ---------------------------------------------------------------------------
# Bans (duplicates / wildcards)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dependencies have no version requirement
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ext-sakamoro/ALICE-DB",
    "https://github.com/ext-sakamoro/ALICE-DetMath",
    "https://github.com/ext-sakamoro/ALICE-ML",
    "https://github.com/ext-sakamoro/ALICE-Physics",
    "https://github.com/ext-sakamoro/ALICE-SDF",
    "https://github.com/ext-sakamoro/ALICE-Serial",
    "https://github.com/ext-sakamoro/ALICE-Zip",
]
